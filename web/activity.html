<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Activity</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <header class="page-header">
      <div>
        <h1>Activity</h1>
        <p class="page-subtitle">Track system activity, transactions and user actions.</p>
      </div>
    </header>
    <section class="card">
      <div class="card-header"><h2 class="card-title">Who's online</h2></div>
      <div id="presence-list"></div>
    </section>

    <section class="card">
      <div class="card-header"><div><h2 class="card-title">Activity log</h2><p class="card-subtitle">A record of all important actions in your store.</p></div></div>
      <div class="form-grid">
        <label>User
          <select id="filter-user"><option value="">All staff</option></select>
        </label>
        <label>Action
          <select id="filter-action"><option value="">All actions</option></select>
        </label>
        <label>From <input type="date" id="filter-from" /></label>
        <label>To <input type="date" id="filter-to" /></label>
      </div>
      <div id="activity-table" class="table-wrap" style="margin-top: 14px;"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/activity-page.js"></script>
</body>
</html>
