<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Admin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="theme-color" content="#17563b" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <h1>Add a product</h1>
    <div class="card">
      <form id="product-form" class="admin-form">
        <div class="form-grid">
          <label>SKU <input type="text" name="sku" required /></label>
          <label>Barcode <input type="text" name="barcode" /></label>
          <label>Name <input type="text" name="name" required /></label>
          <label>Currency
            <select name="currency">
              <option value="USD">USD</option>
              <option value="ZWG">ZWG</option>
              <option value="ZAR">ZAR</option>
            </select>
          </label>
          <label>Retail price <input type="number" name="retail_price" min="0" step="0.01" required /></label>
          <label>Wholesale price <input type="number" name="wholesale_price" min="0" step="0.01" /></label>
          <label>Min. wholesale qty <input type="number" name="min_wholesale_qty" min="1" step="1" value="6" /></label>
          <label>Cost price (per unit) <input type="number" name="cost_price" min="0" step="0.01" required /></label>
          <label>Initial stock location
            <select name="location_id"></select>
          </label>
          <label>Initial quantity <input type="number" name="initial_qty" min="0" step="1" value="0" /></label>
        </div>
        <label>Photo <input type="file" name="photo" accept="image/*" /></label>
        <div id="photo-preview"></div>
        <button type="submit" class="primary">Add product</button>
        <p class="error" id="product-error"></p>
        <p id="product-success" style="color: var(--brand-dark); font-size: 0.9rem;"></p>
      </form>
    </div>

    <h1 style="margin-top: 1.5rem;">Products</h1>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th></th>
            <th>SKU</th>
            <th>Name</th>
            <th>Retail</th>
            <th>Wholesale</th>
            <th>Stock (all locations)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="product-list-body">
          <tr><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
