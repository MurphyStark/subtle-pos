<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Admin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="theme-color" content="#17563b" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <h1>Add a product</h1>
    <p style="color: var(--text-muted); margin-top: -0.5rem;">
      Create the product itself first (name, price, cost, photo) — then add its size/color
      variants below. A product isn't sellable until it has at least one variant.
    </p>
    <div class="card">
      <form id="product-form" class="admin-form">
        <div class="form-grid">
          <label>Name <input type="text" name="name" required /></label>
          <label>Currency
            <select name="currency">
              <option value="USD">USD</option>
              <option value="ZWG">ZWG</option>
              <option value="ZAR">ZAR</option>
            </select>
          </label>
          <label>Retail price <input type="number" name="retail_price" min="0" step="0.01" required /></label>
          <label>Wholesale price <input type="number" name="wholesale_price" min="0" step="0.01" /></label>
          <label>Min. wholesale qty <input type="number" name="min_wholesale_qty" min="1" step="1" value="6" /></label>
          <label>Cost price (per unit) <input type="number" name="cost_price" min="0" step="0.01" required /></label>
        </div>
        <label>Description <textarea name="description" rows="2" style="width: 100%; font: inherit; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--border);"></textarea></label>
        <label>Photo <input type="file" name="photo" accept="image/*" /></label>
        <div id="photo-preview"></div>
        <button type="submit" class="primary">Add product</button>
        <p class="error" id="product-error"></p>
        <p id="product-success" style="color: var(--brand-dark); font-size: 0.9rem;"></p>
      </form>
    </div>

    <h1 style="margin-top: 1.5rem;">Products &amp; variants</h1>
    <div id="product-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
