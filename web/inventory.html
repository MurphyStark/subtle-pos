<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Inventory</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <header class="page-header">
      <div>
        <h1>Inventory</h1>
        <p class="page-subtitle">Track stock levels across all products and variants.</p>
      </div>
    </header>
    <p class="error" id="inventory-error"></p>

    <section class="card">
      <div class="toolbar">
        <label class="search">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="inventory-search" placeholder="Search by product name, SKU or barcode…" aria-label="Search inventory" />
        </label>
        <select id="filter-category" aria-label="Category"><option value="">All categories</option></select>
        <select id="filter-status" aria-label="Stock level">
          <option value="">All stock levels</option>
          <option value="in">In stock</option>
          <option value="low">Low stock</option>
          <option value="out">Out of stock</option>
        </select>
        <button type="button" class="ghost" id="export-btn" style="height: 46px;"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg> Export</button>
      </div>

      <div class="stat-grid" id="inventory-stats"></div>

      <div class="table-wrap">
        <table>
          <thead id="inventory-head"></thead>
          <tbody id="inventory-body"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" id="inventory-pagination"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/inventory.js"></script>
</body>
</html>
