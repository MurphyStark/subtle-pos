<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Inventory</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <h1>Inventory balances</h1>
    <p class="error" id="inventory-error"></p>
    <div class="card">
      <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
        <input type="checkbox" id="low-stock-toggle" /> Show low-stock only
      </label>
      <p id="low-stock-summary" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.4rem;"></p>
      <table>
        <thead id="inventory-head"></thead>
        <tbody id="inventory-body">
          <tr><td colspan="8">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/inventory.js"></script>
</body>
</html>
