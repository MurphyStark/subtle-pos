<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Checkout</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <div id="status-banner"></div>

    <div class="pos-layout">
      <section class="card">
        <div class="sale-type-toggle">
          <button type="button" id="type-retail" class="active">Retail</button>
          <button type="button" id="type-wholesale">Wholesale</button>
        </div>
        <input type="search" id="product-search" class="product-search" placeholder="Search by name, SKU, or barcode…" />
        <div id="product-grid" class="product-grid"></div>
      </section>

      <section class="card">
        <h2>Cart</h2>
        <div id="cart-lines"></div>
        <div class="cart-totals">
          <div class="line"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
          <div class="line">
            <span>Discount code</span>
            <div style="display: flex; gap: 0.4rem;">
              <input type="text" id="discount-code-input" placeholder="CODE" style="width: 90px; text-transform: uppercase;" />
              <button type="button" id="apply-discount-code-btn" class="ghost">Apply</button>
            </div>
          </div>
          <p id="discount-code-status" style="font-size: 0.8rem; color: var(--text-muted); margin: -0.4rem 0 0.4rem;"></p>
          <div class="line">
            <span>Manual discount</span>
            <input type="number" id="cart-discount" min="0" step="0.01" value="0" style="width: 90px; text-align: right;" />
          </div>
          <div class="line">
            <span>Tax (VAT)</span>
            <input type="number" id="cart-tax" min="0" step="0.01" value="0" style="width: 90px; text-align: right;" />
          </div>
          <div class="line grand"><span>Total</span><span id="cart-total">$0.00</span></div>
        </div>
        <div id="manager-pin-row" hidden style="margin-top: 0.75rem;">
          <label for="manager-pin-input" style="font-size: 0.85rem; color: var(--text-muted);">
            Manual discount needs manager approval — enter their PIN
          </label>
          <input type="text" id="manager-pin-input" inputmode="numeric" placeholder="Manager PIN" style="width: 100%;" />
        </div>
        <div style="margin-top: 0.75rem;">
          <label style="font-size: 0.85rem; color: var(--text-muted);">Customer (optional)</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="customer-name" placeholder="Name" style="flex: 1;" />
            <input type="tel" id="customer-phone" placeholder="Phone" style="flex: 1;" />
          </div>
        </div>
        <div style="margin-top: 0.75rem;">
          <label for="payment-method" style="font-size: 0.85rem; color: var(--text-muted);">Payment method</label>
          <select id="payment-method" style="width: 100%;">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="ecocash">EcoCash</option>
            <option value="bank_transfer">Bank transfer</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button type="button" id="checkout-btn" class="primary" style="width: 100%; margin-top: 0.9rem;" disabled>
          Complete sale
        </button>
        <p class="error" id="checkout-error"></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/pos.js"></script>
</body>
</html>
