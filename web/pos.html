<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Checkout</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <header class="page-header">
      <div><h1>Checkout</h1></div>
    </header>

    <div id="status-banner"></div>

    <div class="pos-layout">
      <section>
        <label class="search pos-search">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="product-search" class="product-search" placeholder="Search products or scan barcode…" aria-label="Search products or scan barcode" />
        </label>
        <div id="category-chips" class="chips" role="tablist" aria-label="Categories"></div>
        <div id="product-grid" class="product-grid"></div>
      </section>

      <section class="card cart-panel" id="cart-panel" aria-label="Cart">
        <div class="card-header">
          <h2 class="card-title">Cart <span id="cart-count" class="muted" style="font-weight: 500; font-size: 16px;"></span></h2>
          <button type="button" id="cart-clear" class="link-danger" hidden>Clear</button>
        </div>
        <div id="cart-lines"></div>

        <div class="cart-field">
          <label>Customer (optional)</label>
          <div class="cart-field-row">
            <input type="text" id="customer-name" placeholder="Name" />
            <input type="tel" id="customer-phone" placeholder="Phone" />
          </div>
        </div>

        <div class="cart-field">
          <label for="discount-code-input">Discount code</label>
          <div class="cart-field-row">
            <input type="text" id="discount-code-input" placeholder="Enter code" style="text-transform: uppercase;" />
            <button type="button" id="apply-discount-code-btn" class="outline-brand">Apply</button>
          </div>
          <p id="discount-code-status" style="font-size: 13px; color: var(--text-muted); margin: 0;"></p>
        </div>

        <details class="cart-more">
          <summary>Manual discount &amp; tax</summary>
          <div class="cart-totals" style="border-top: none; padding-top: 4px;">
            <div class="line"><span>Manual discount</span><input type="number" id="cart-discount" min="0" step="0.01" value="0" /></div>
            <div class="line"><span>Tax (VAT)</span><input type="number" id="cart-tax" min="0" step="0.01" value="0" /></div>
          </div>
          <div id="manager-pin-row" hidden style="margin-top: 8px;">
            <label for="manager-pin-input">Manual discount needs manager approval — enter their PIN</label>
            <input type="text" id="manager-pin-input" inputmode="numeric" placeholder="Manager PIN" style="width: 100%; margin-top: 6px;" />
          </div>
        </details>

        <div class="cart-totals">
          <div class="line"><span>Subtotal</span><span id="cart-subtotal">$0.00</span></div>
          <div class="line"><span>Discount</span><span id="cart-discount-total">−$0.00</span></div>
          <div class="line"><span>Tax (VAT)</span><span id="cart-tax-total">$0.00</span></div>
          <div class="line grand"><span>Total</span><span id="cart-total">$0.00</span></div>
        </div>

        <div class="cart-field">
          <label for="payment-method">Payment method</label>
          <select id="payment-method" style="width: 100%;">
            <option value="cash">Cash</option>
            <option value="card">Card</option>
            <option value="ecocash">EcoCash</option>
            <option value="bank_transfer">Bank transfer</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button type="button" id="checkout-btn" class="primary charge-btn" disabled>Complete sale</button>
        <p class="error" id="checkout-error"></p>
      </section>
    </div>
    <button type="button" id="mobile-cart-bar" class="primary mobile-cart-bar" hidden></button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/pos.js"></script>
</body>
</html>
