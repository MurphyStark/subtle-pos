<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Purchase Orders</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#17563b" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <h1>Raise a purchase order</h1>
    <div class="card">
      <form id="po-form" class="admin-form">
        <div class="form-grid">
          <label>Supplier <input type="text" name="supplier_name" required placeholder="e.g. Harare Leather Co." /></label>
          <label>Destination location
            <select name="location_id"></select>
          </label>
          <label>Currency
            <select name="currency">
              <option value="USD">USD</option>
              <option value="ZWG">ZWG</option>
              <option value="ZAR">ZAR</option>
            </select>
          </label>
        </div>

        <h2 style="font-size: 0.95rem; margin-top: 1rem;">Line items</h2>
        <div class="add-variant-form" style="grid-template-columns: 2fr 1fr 1fr auto;">
          <label>Variant <select id="po-line-variant"></select></label>
          <label>Quantity <input type="number" id="po-line-qty" min="1" step="1" value="1" /></label>
          <label>Expected unit cost <input type="number" id="po-line-cost" min="0" step="0.01" /></label>
          <button type="button" id="po-line-add" class="ghost">Add line</button>
        </div>
        <table class="variant-table" style="margin-top: 0.75rem;">
          <thead><tr><th>Variant</th><th>Qty</th><th>Expected cost</th><th></th></tr></thead>
          <tbody id="po-lines-body"></tbody>
        </table>

        <button type="submit" class="primary" id="po-submit-btn" disabled>Create purchase order</button>
        <p class="error" id="po-error"></p>
        <p id="po-success" style="color: var(--brand-dark); font-size: 0.9rem;"></p>
      </form>
    </div>

    <h1 style="margin-top: 1.5rem;">Purchase orders</h1>
    <div id="po-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/purchase-orders.js"></script>
</body>
</html>
