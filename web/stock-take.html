<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Stock Take</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <header class="page-header">
      <div>
        <h1>Stock Take</h1>
        <p class="page-subtitle">Count and reconcile your physical stock with system records.</p>
      </div>
      <div class="page-actions">
        <a class="button ghost" href="stock-takes.html">History</a>
      </div>
    </header>

    <div id="status-banner"></div>

    <ol class="stepper card" id="stepper" aria-label="Stock take steps">
      <li data-step="1"><span class="step-dot">1</span><span><strong>Select products</strong><small>Choose items to count</small></span></li>
      <li data-step="2"><span class="step-dot">2</span><span><strong>Count stock</strong><small>Enter physical quantities</small></span></li>
      <li data-step="3"><span class="step-dot">3</span><span><strong>Review</strong><small>Check variances</small></span></li>
      <li data-step="4"><span class="step-dot">4</span><span><strong>Complete</strong><small>Post stock take</small></span></li>
    </ol>

    <div class="split-layout">
      <section class="card" id="step-main">Loading…</section>
      <aside class="split-side" id="step-side"></aside>
    </div>
    <div class="card wizard-footer" id="step-footer" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/stock-take.js"></script>
</body>
</html>
