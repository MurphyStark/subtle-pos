<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Transfers</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#111111" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <header class="page-header">
      <div>
        <h1>Transfers</h1>
        <p class="page-subtitle">Move stock between the shop and the warehouse.</p>
      </div>
    </header>
    <section class="card">
      <div class="card-header"><h2 class="card-title">Move stock</h2></div>
      <form id="transfer-form" class="admin-form">
        <div class="form-grid">
          <label>From <select name="from_location_id"></select></label>
          <label>To <select name="to_location_id"></select></label>
          <label>Variant <select name="variant_id"></select></label>
          <label>Quantity <input type="number" name="quantity" min="1" step="1" value="1" required /></label>
        </div>
        <p id="transfer-available" class="muted" style="margin: 0; font-size: 14px;"></p>
        <div><button type="submit" class="primary">Move stock</button></div>
        <p class="error" id="transfer-error"></p>
        <p class="success" id="transfer-success"></p>
      </form>
    </section>

    <h2 class="section-title">Transfer history</h2>
    <section class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>From</th><th>To</th><th>Variant</th><th>Qty</th><th>Status</th></tr>
        </thead>
        <tbody id="transfer-list-body">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/transfers.js"></script>
</body>
</html>
