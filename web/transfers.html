<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subtle POS — Transfers</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="apple-touch-icon" href="icons/favicon.png" />
  <meta name="theme-color" content="#17563b" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav id="app-nav"></nav>

  <main>
    <h1>Request a stock transfer</h1>
    <div class="card">
      <form id="transfer-form" class="admin-form">
        <div class="form-grid">
          <label>From <select name="from_location_id"></select></label>
          <label>To <select name="to_location_id"></select></label>
          <label>Variant <select name="variant_id"></select></label>
          <label>Quantity <input type="number" name="quantity" min="1" step="1" value="1" required /></label>
        </div>
        <button type="submit" class="primary">Request transfer</button>
        <p class="error" id="transfer-error"></p>
        <p id="transfer-success" style="color: var(--brand-dark); font-size: 0.9rem;"></p>
      </form>
    </div>

    <h1 style="margin-top: 1.5rem;">Transfers</h1>
    <div class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>From</th><th>To</th><th>Variant</th><th>Qty</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="transfer-list-body">
          <tr><td colspan="7">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/transfers.js"></script>
</body>
</html>
